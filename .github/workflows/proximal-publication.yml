name: Proximal async RL CPU checks

on:
  pull_request:
    paths:
      - "miles_plugins/proximal/**"
      - "miles/**"
      - "train_async.py"
      - "tests/fast/test_train_async.py"
      - "tests/fast/proximal_publication/**"
      - "tests/integration/proximal_async/**"
      - ".github/workflows/proximal-publication.yml"
  push:
    branches: [main]
    paths:
      - "miles_plugins/proximal/**"
      - "tests/fast/proximal_publication/**"
      - "tests/integration/proximal_async/**"
      - ".github/workflows/proximal-publication.yml"

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: 94602c9c2b7cbdb8efd5c52802dac6a1c180089e
          path: .cpu-sglang
      - name: Build CPU environment
        run: docker build -t proximal-cpu -f tests/integration/proximal_async/Dockerfile .
      - name: Fetch tokenizer only at a pinned revision
        run: |
          mkdir -p .cpu-tokenizer
          docker run --rm -v "$PWD/.cpu-tokenizer:/tokenizer" proximal-cpu python -c 'from huggingface_hub import snapshot_download; snapshot_download("Qwen/Qwen3-0.6B", revision="c1899de289a04d12100db370d81485cdf75e47ca", allow_patterns=["tokenizer.json", "tokenizer_config.json", "config.json", "vocab.json", "merges.txt"], local_dir="/tokenizer")'
      - name: Offline CPU integration and publication tests
        run: |
          docker run --rm --network none \
            -v "$PWD:/work:ro" -v "$PWD/.cpu-sglang:/sglang:ro" -v "$PWD/.cpu-tokenizer:/tokenizer:ro" \
            proximal-cpu python -m pytest --confcutdir=tests/integration/proximal_async \
            tests/integration/proximal_async tests/fast/proximal_publication \
            tests/fast/rollout/test_fully_async_rollout.py tests/fast/utils/test_arguments.py \
            tests/fast/backends/training_utils/weight_update/test_connection_contract.py \
            tests/fast/backends/training_utils/weight_update/test_dist_weight_update_lifecycle.py \
            tests/fast/backends/training_utils/weight_update/test_lora_update_weight.py \
            tests/fast/backends/training_utils/weight_update/test_lora_weight_sync_validation.py \
            tests/fast/rollout/session tests/fast/test_train_async.py -q -p no:cacheprovider
      - name: Strict adapter types
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" proximal-cpu \
            python -m mypy --cache-dir=/tmp/mypy --follow-imports=silent --strict miles_plugins/proximal
      - name: Style
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" proximal-cpu ruff check --no-cache miles_plugins/proximal tests/integration/proximal_async tests/fast/proximal_publication
          docker run --rm --network none -v "$PWD:/work:ro" proximal-cpu black --check miles_plugins/proximal tests/integration/proximal_async tests/fast/proximal_publication
          docker run --rm --network none -v "$PWD:/work:ro" proximal-cpu isort --check-only miles_plugins/proximal tests/integration/proximal_async tests/fast/proximal_publication
