name: PR Test
run-name: "PR2849 CPU and pre-commit at 9f00b2724e"
on:
  workflow_dispatch:
    inputs:
      ci_megatron_pr:
        type: string
        default: '73b54618f7e58e0f25f619bcfecbe2640765475a'
      ci_sglang_pr:
        type: string
        default: '02b5e123c490c988d21526d0dd7837fefdd0e1da'
permissions:
  contents: read
jobs:
  stage-a-cpu:
    strategy:
      fail-fast: false
      matrix:
        partition_id: [0, 1, 2, 3]
    uses: ./.github/workflows/_run-cpu-ci.yml
    with:
      ref: 9f00b2724e6ea1144815a70dace46f21d0bee8aa
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu --suite stage-a-cpu
        --auto-partition-id ${{ matrix.partition_id }} --auto-partition-size 4
        --cadence regular
        --labels run-ci-image,run-ci-multi-lora
    secrets: inherit

  # Stage B: CPU-only bucket for slower CPU tests that don't fit stage-a-cpu's
  # fast budget. Always runs on PR; an empty suite still exits 0 in run_suite.py.
  stage-b-cpu:
    uses: ./.github/workflows/_run-cpu-ci.yml
    with:
      ref: 9f00b2724e6ea1144815a70dace46f21d0bee8aa
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu --suite stage-b-cpu
        --cadence regular
        --labels run-ci-image,run-ci-multi-lora
    secrets: inherit

  run-pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 9f00b2724e6ea1144815a70dace46f21d0bee8aa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Install pre-commit
        run: pip install --upgrade pip pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

